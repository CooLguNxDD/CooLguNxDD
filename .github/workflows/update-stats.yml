name: Update GitHub Stats

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      theme:
        description: 'Theme preset (CatPortfolio / Catppuccin)'
        required: false
        type: choice
        default: 'catportfolio'
        options:
          - catportfolio
          - mocha
          - macchiato
          - frappe
          - latte
      accent:
        description: 'Accent color pair'
        required: false
        type: choice
        default: 'violet'
        options:
          - violet
          - mauve
          - sapphire
          - peach
          - green
          - pink

permissions:
  contents: write

concurrency:
  group: update-github-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Generate stats SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          CAT_THEME: ${{ inputs.theme }}
          CAT_ACCENT: ${{ inputs.accent }}
        run: python scripts/generate_stats.py

      - name: Commit and push updated cards
        run: |
          if [ -z "$(git status --porcelain assets/)" ]; then
            echo "No changes to stats SVGs."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-banner.svg assets/catportfolio-card.svg assets/cat-fleet-strip.svg assets/ai-tools-cat.svg assets/github-stats.svg assets/top-langs.svg assets/light/
          git commit -m "chore(stats): refresh GitHub stats cards [skip ci]"
          git push
