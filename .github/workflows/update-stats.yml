name: Update GitHub Stats

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-github-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Generate stats SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_stats.py

      - name: Commit and push updated cards
        run: |
          if [ -z "$(git status --porcelain assets/hero-banner.svg assets/catportfolio-card.svg assets/cat-fleet-strip.svg assets/github-stats.svg assets/top-langs.svg)" ]; then
            echo "No changes to stats SVGs."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-banner.svg assets/catportfolio-card.svg assets/cat-fleet-strip.svg assets/github-stats.svg assets/top-langs.svg
          git commit -m "chore(stats): refresh GitHub stats cards [skip ci]"
          git push
