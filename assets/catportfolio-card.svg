<svg xmlns="http://www.w3.org/2000/svg" width="440" height="140" viewBox="0 0 440 140" role="img" aria-labelledby="title desc">
  <title id="title">CatPortfolio</title>
  <desc id="desc">Self-rendering GenUI portfolio — React 19, Three.js aquarium, Zod layout. Live at coolgunxdd.github.io/CatPortfolio</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14111f"/>
      <stop offset="100%" stop-color="#1c1730"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#863bff"/>
      <stop offset="100%" stop-color="#47bfff"/>
    </linearGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#47bfff"/>
      <stop offset="100%" stop-color="#7ee0ff"/>
    </linearGradient>
  </defs>

  <rect width="440" height="140" rx="12" fill="url(#bg)" stroke="#3a3358" stroke-width="1"/>
  <rect x="0" y="0" width="5" height="140" rx="2.5" fill="url(#bar)"/>

  <!-- cat head -->
  <g transform="translate(22,36)">
    <polygon points="10,18 14,2 22,18" fill="#e8d7ff"/>
    <polygon points="30,18 38,2 42,18" fill="#e8d7ff"/>
    <ellipse cx="26" cy="28" rx="18" ry="16" fill="#e8d7ff"/>
    <ellipse cx="20" cy="26" rx="3.1" ry="3.6" fill="#161225"/>
    <ellipse cx="32" cy="26" rx="3.1" ry="3.6" fill="#161225"/>
    <circle cx="21" cy="25.2" r="1.1" fill="#47bfff"/>
    <circle cx="33" cy="25.2" r="1.1" fill="#47bfff"/>
    <path d="M24 32.5 C25 34.5 27 34.5 28 32.5" fill="none" stroke="#863bff" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- bubbles + fish -->
  <circle cx="400" cy="28" r="3" fill="#47bfff" fill-opacity="0.35"/>
  <circle cx="412" cy="48" r="2" fill="#863bff" fill-opacity="0.4"/>
  <circle cx="392" cy="58" r="1.5" fill="#47bfff" fill-opacity="0.3"/>
  <g transform="translate(378,92)">
    <ellipse cx="16" cy="8" rx="14" ry="7" fill="url(#fish)" fill-opacity="0.55"/>
    <polygon points="2,8 -6,2 -6,14" fill="#47bfff" fill-opacity="0.5"/>
    <circle cx="22" cy="6.5" r="1.3" fill="#14111f"/>
  </g>

  <text x="88" y="42" fill="#f4eefc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">CatPortfolio</text>
  <rect x="232" y="26" width="40" height="18" rx="9" fill="#863bff" fill-opacity="0.25" stroke="#863bff" stroke-opacity="0.7"/>
  <text x="252" y="39" text-anchor="middle" fill="#d7c2ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700">LIVE</text>

  <text x="88" y="66" fill="#b5abc8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Self-rendering GenUI · WebGL aquarium</text>

  <!-- chips -->
  <rect x="88" y="80" width="62" height="22" rx="6" fill="#2a2440" stroke="#4a4270"/>
  <text x="119" y="95" text-anchor="middle" fill="#e8d7ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">React 19</text>
  <rect x="156" y="80" width="64" height="22" rx="6" fill="#2a2440" stroke="#4a4270"/>
  <text x="188" y="95" text-anchor="middle" fill="#e8d7ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Three.js</text>
  <rect x="226" y="80" width="42" height="22" rx="6" fill="#2a2440" stroke="#4a4270"/>
  <text x="247" y="95" text-anchor="middle" fill="#e8d7ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Zod</text>
  <rect x="274" y="80" width="44" height="22" rx="6" fill="#2a2440" stroke="#4a4270"/>
  <text x="296" y="95" text-anchor="middle" fill="#e8d7ff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Vite</text>

  <text x="88" y="124" fill="#47bfff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">coolgunxdd.github.io/CatPortfolio →</text>
</svg>
