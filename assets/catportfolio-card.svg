<svg xmlns="http://www.w3.org/2000/svg" width="440" height="140" viewBox="0 0 440 140" role="img" aria-labelledby="cp-title cp-desc">
  <!-- theme: catportfolio/peach -->
  <title id="cp-title">CatPortfolio</title>
  <desc id="cp-desc">Self-rendering GenUI portfolio — React 19, Three.js aquarium, Zod layout. Live at coolgunxdd.github.io/CatPortfolio</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14111f"/>
      <stop offset="100%" stop-color="#1c1730"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fab387"/>
      <stop offset="100%" stop-color="#f9e2af"/>
    </linearGradient>
    <linearGradient id="cp-fish" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f9e2af"/>
      <stop offset="100%" stop-color="#fab387"/>
    </linearGradient>
    <radialGradient id="cp-cat-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fab387" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#fab387" stop-opacity="0"/>
    </radialGradient>
    <style>
      .anim { will-change: transform, opacity; }
      .cat-tail { transform-box: fill-box; transform-origin: 10% 90%; animation: cat-tail 2.8s ease-in-out infinite; }
      .cat-blink { transform-box: fill-box; transform-origin: 50% 50%; animation: cat-blink 4.6s ease-in-out infinite; }
      .cat-ear { transform-box: fill-box; transform-origin: 40% 95%; animation: cat-ear 5.4s ease-in-out infinite; }
      .cat-breathe { transform-box: fill-box; transform-origin: 50% 100%; animation: cat-breathe 3.2s ease-in-out infinite; }
      .cat-head { transform-box: fill-box; transform-origin: 50% 85%; animation: cat-head 5.5s ease-in-out infinite; }
      .cat-pupils { animation: cat-pupils 5.5s ease-in-out infinite; }
      .cp-fish-bob { animation: cp-fish-bob 5.5s ease-in-out infinite; }
      .cp-fish-2 { animation: cp-fish-2 6.8s ease-in-out -2.2s infinite; }
      .tail-wag { transform-box: fill-box; transform-origin: 100% 50%; animation: tail-wag 0.55s ease-in-out infinite; }
      .cp-bubble { animation: cp-bubble 3.8s ease-in infinite; }
      @keyframes cat-tail {
        0%, 100% { transform: rotate(-10deg); }
        50% { transform: rotate(12deg); }
      }
      @keyframes cat-blink {
        0%, 92%, 100% { transform: scaleY(1); }
        96% { transform: scaleY(0.1); }
      }
      @keyframes cat-ear {
        0%, 84%, 100% { transform: rotate(0deg); }
        88% { transform: rotate(-11deg); }
        92% { transform: rotate(4deg); }
      }
      @keyframes cat-breathe {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(1.028); }
      }
      @keyframes cat-head {
        0%, 100% { transform: rotate(1.5deg); }
        33% { transform: rotate(-2.5deg); }
        66% { transform: rotate(3deg); }
      }
      @keyframes cat-pupils {
        0%, 100% { transform: translate(1.2px, 0.2px); }
        33% { transform: translate(1.5px, -1.0px); }
        66% { transform: translate(0.7px, 0.7px); }
      }
      @keyframes cp-fish-bob {
        0%, 100% { transform: translate(0px, 0px); }
        33% { transform: translate(-22px, -12px); }
        66% { transform: translate(-8px, 6px); }
      }
      @keyframes cp-fish-2 {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(20px, -9px); }
      }
      @keyframes tail-wag {
        0%, 100% { transform: rotate(-13deg); }
        50% { transform: rotate(13deg); }
      }
      @keyframes cp-bubble {
        0% { transform: translateY(6px); opacity: 0; }
        25% { opacity: 0.85; }
        80% { opacity: 0.65; }
        100% { transform: translateY(-28px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .anim { animation: none !important; }
      }
    </style>
    <clipPath id="cp-clip">
      <rect x="0" y="0" width="440" height="140" rx="12"/>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="439" height="139" rx="12" fill="url(#bg)" stroke="#3a3358" stroke-width="1"/>
  <rect x="0" y="0" width="5" height="140" fill="url(#accent)" clip-path="url(#cp-clip)"/>

  <!-- breed: white -->
  <circle cx="48" cy="76" r="34" fill="url(#cp-cat-glow)"/>
  <g transform="translate(48, 78) scale(1, 1) scale(0.86)">
  <ellipse cx="0" cy="30" rx="21" ry="3.8" fill="#000000" fill-opacity="0.22"/>
  <g transform="translate(14, 24)">
    <g class="anim cat-tail">
      <path d="M0,0 C13,-2 21,-16 16,-29 C14,-33 9,-31 10,-26 C12,-18 8,-8 -2,-3 Z" fill="#ddd6ee" stroke="#c4b6e6" stroke-width="1"/>
      
    </g>
  </g>
  <g class="anim cat-breathe">
    <path d="M-18,28 C-20,11 -13,-4 0,-4 C13,-4 20,11 18,28 C18,30.5 14,31.5 0,31.5 C-14,31.5 -18,30.5 -18,28 Z" fill="#f8f6fc" stroke="#c4b6e6" stroke-width="1.1"/>
    <ellipse cx="0" cy="14" rx="8.5" ry="11.5" fill="#ffffff" fill-opacity="0.92"/>
    <g transform="translate(0, 12)"></g>
    <ellipse cx="-8.5" cy="28.2" rx="5.8" ry="3.6" fill="#ffffff" stroke="#c4b6e6" stroke-width="0.95"/>
    <ellipse cx="8.5" cy="28.2" rx="5.8" ry="3.6" fill="#ffffff" stroke="#c4b6e6" stroke-width="0.95"/>
  </g>
  <g class="anim cat-head">
    <path d="M-16,-22 L-19,-40 C-19,-42 -16,-43 -14,-41 L-3,-30 Z" fill="#f8f6fc" stroke="#c4b6e6" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M-14.5,-24 L-16.5,-36 L-6.5,-29 Z" fill="#f4b4cc"/>
    <g transform="translate(12, -26)">
      <g class="anim cat-ear">
        <path d="M-9,-4 L2,-15 C4,-17 7,-16 7,-14 L4,4 Z" fill="#f8f6fc" stroke="#c4b6e6" stroke-width="1.1" stroke-linejoin="round"/>
        <path d="M-5.5,-3 L4.5,-10 L2.5,2 Z" fill="#f4b4cc"/>
      </g>
    </g>
    <path d="M-19,-15 C-19,-26 -11,-32 0,-32 C11,-32 19,-26 19,-15 C20,-5 13,1 0,1 C-13,1 -20,-5 -19,-15 Z" fill="#f8f6fc" stroke="#c4b6e6" stroke-width="1.15"/>
    <g transform="translate(0, -16)"><path d="M-3,-13.5 Q0,-16 3,-13.5" fill="none" stroke="#e8e1f7" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/></g>
    <ellipse cx="-11.5" cy="-10" rx="3.4" ry="1.8" fill="#f49ac1" fill-opacity="0.38"/>
    <ellipse cx="11.5" cy="-10" rx="3.4" ry="1.8" fill="#f49ac1" fill-opacity="0.38"/>
    <g class="anim cat-blink">
      <ellipse cx="-7.5" cy="-16" rx="3.6" ry="4.2" fill="#47bfff"/>
      <ellipse cx="7.5" cy="-16" rx="3.6" ry="4.2" fill="#47bfff"/>
      <g class="anim cat-pupils">
        <ellipse cx="-7.5" cy="-16" rx="1.9" ry="3.1" fill="#161225"/>
        <circle cx="-6.2" cy="-17.5" r="1.25" fill="#ffffff"/>
        <circle cx="-8.5" cy="-14.2" r="0.65" fill="#ffffff" fill-opacity="0.85"/>
        <ellipse cx="7.5" cy="-16" rx="1.9" ry="3.1" fill="#161225"/>
        <circle cx="8.8" cy="-17.5" r="1.25" fill="#ffffff"/>
        <circle cx="6.5" cy="-14.2" r="0.65" fill="#ffffff" fill-opacity="0.85"/>
      </g>
    </g>
    <polygon points="-1.8,-11.5 1.8,-11.5 0,-9.5" fill="#f09ab8"/>
    <path d="M-3.5,-8.2 Q-1.8,-6.5 0,-8.5 Q1.8,-6.5 3.5,-8.2" fill="none" stroke="#863bff" stroke-width="1.35" stroke-linecap="round"/>
    <g stroke="#c9bfe0" stroke-width="0.9" stroke-linecap="round" fill="none">
      <path d="M-12,-11.5 Q-19,-13 -24,-12"/><path d="M-12.5,-9.5 Q-20,-9.5 -25,-8.5"/><path d="M-12,-7.5 Q-18,-6 -23,-4.5"/>
      <path d="M12,-11.5 Q19,-13 24,-12"/><path d="M12.5,-9.5 Q20,-9.5 25,-8.5"/><path d="M12,-7.5 Q18,-6 23,-4.5"/>
    </g>
  </g>
  </g>

  <circle class="anim cp-bubble" cx="400" cy="28" r="3" fill="#47bfff" fill-opacity="0.35" style="animation-duration:4.2s;animation-delay:-1.0s"/>
  <circle class="anim cp-bubble" cx="412" cy="48" r="2" fill="#863bff" fill-opacity="0.4" style="animation-duration:3.6s;animation-delay:-2.2s"/>
  <circle class="anim cp-bubble" cx="392" cy="58" r="1.5" fill="#47bfff" fill-opacity="0.3" style="animation-duration:4.8s;animation-delay:-0.5s"/>
  <g transform="translate(362, 52)">
    <g class="anim cp-fish-2">
      <g transform="scale(-0.7, 0.7)">
        <g transform="translate(-9, 0)">
          <g class="anim tail-wag">
            <polygon points="0,0 -8,-4.5 -6,0 -8,4.5" fill="#f5c2e7" fill-opacity="0.75"/>
          </g>
        </g>
        <ellipse cx="2" cy="0" rx="11" ry="5.5" fill="#fab387" fill-opacity="0.75"/>
        <circle cx="8" cy="-1" r="1.2" fill="#14111f"/>
      </g>
    </g>
  </g>
  <g transform="translate(384, 94)">
    <g class="anim cp-fish-bob">
      <polygon points="14,1 18,-4 20,2" fill="#fab387" fill-opacity="0.75"/>
      <ellipse cx="16" cy="8" rx="14" ry="7" fill="url(#cp-fish)" fill-opacity="0.82"/>
      <g transform="translate(2, 8)">
        <g class="anim tail-wag">
          <polygon points="0,0 -8,-6 -6,0 -8,6" fill="#f9e2af" fill-opacity="0.82"/>
        </g>
      </g>
      <circle cx="23" cy="6.5" r="1.4" fill="#14111f"/>
      <circle cx="23.5" cy="6.0" r="0.5" fill="#ffffff"/>
    </g>
  </g>

  <text x="88" y="42" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#f4eefc">CatPortfolio</text>
  <rect x="232" y="26" width="40" height="18" rx="9" fill="#fab387" fill-opacity="0.25" stroke="#fab387" stroke-opacity="0.7"/>
  <text x="252" y="39" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#f5c2e7">LIVE</text>

  <text x="88" y="66" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b5abc8">Self-rendering GenUI · WebGL aquarium</text>

  <rect x="88" y="80" width="62" height="22" rx="6" fill="#2a2440" stroke="#4a4270"/>
  <text x="119" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#f4eefc">React 19</text>
  <rect x="156" y="80" width="64" height="22" rx="6" fill="#2a2440" stroke="#4a4270"/>
  <text x="188" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#f4eefc">Three.js</text>
  <rect x="226" y="80" width="42" height="22" rx="6" fill="#2a2440" stroke="#4a4270"/>
  <text x="247" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#f4eefc">Zod</text>
  <rect x="274" y="80" width="44" height="22" rx="6" fill="#2a2440" stroke="#4a4270"/>
  <text x="296" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#f4eefc">Vite</text>

  <text x="88" y="124" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#f9e2af">coolgunxdd.github.io/CatPortfolio →</text>

</svg>
