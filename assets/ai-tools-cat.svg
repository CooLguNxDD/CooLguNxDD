<svg xmlns="http://www.w3.org/2000/svg" width="240" height="110" viewBox="0 0 240 110" role="img" aria-labelledby="ai-cat-title ai-cat-desc">
  <!-- theme: mocha/mauve -->
  <title id="ai-cat-title">Fish Catcher</title>
  <desc id="ai-cat-desc">Orange cat pouncing to catch a leaping fish.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <style>
      .anim { will-change: transform, opacity; }
      .cat-tail { transform-box: fill-box; transform-origin: 10% 90%; animation: cat-tail 2.4s ease-in-out infinite; }
      .cat-blink { transform-box: fill-box; transform-origin: 50% 50%; animation: cat-blink 4.8s ease-in-out infinite; }
      .cat-ear { transform-box: fill-box; transform-origin: 40% 95%; animation: cat-ear 5.5s ease-in-out infinite; }
      .catch-hop { transform-box: fill-box; transform-origin: 50% 100%; animation: catch-hop 2.2s ease-in-out infinite; }
      .cat-head { transform-box: fill-box; transform-origin: 50% 85%; animation: cat-head 2.2s ease-in-out infinite; }
      .cat-pupils { animation: cat-pupils 2.2s ease-in-out infinite; }
      .catch-paw { transform-box: fill-box; transform-origin: 15% 65%; animation: catch-paw 2.2s ease-in-out infinite; }
      .catch-fish { animation: catch-fish 2.2s ease-in-out infinite; }
      .splash-pop { animation: splash-pop 2.2s ease-out infinite; }
      .cat-breathe { transform-box: fill-box; transform-origin: 50% 100%; animation: cat-breathe 3.4s ease-in-out infinite; }
      .cat-peek { transform-box: fill-box; transform-origin: 50% 100%; animation: cat-peek 3.2s ease-in-out infinite; }
      .stroll-path { animation: stroll-path 7.2s ease-in-out infinite; }
      .stroll-bob { animation: stroll-bob 0.65s ease-in-out infinite; }
      .leg-a { transform-box: fill-box; transform-origin: 50% 10%; animation: leg-a 0.65s ease-in-out infinite; }
      .leg-b { transform-box: fill-box; transform-origin: 50% 10%; animation: leg-b 0.65s ease-in-out infinite; }
      .loaf-breathe { transform-box: fill-box; transform-origin: 50% 100%; animation: loaf-breathe 3.8s ease-in-out infinite; }
      .nap-tail { transform-box: fill-box; transform-origin: 0% 50%; animation: nap-tail 4.8s ease-in-out infinite; }
      .zzz-1 { animation: zzz-float 2.8s ease-out infinite; }
      .zzz-2 { animation: zzz-float 2.8s ease-out 0.8s infinite; }
      .zzz-3 { animation: zzz-float 2.8s ease-out 1.6s infinite; }
      .play-hop { transform-box: fill-box; transform-origin: 50% 100%; animation: play-hop 1.9s ease-in-out infinite; }
      .cat-bat { transform-box: fill-box; transform-origin: 10% 50%; animation: cat-bat 1.9s ease-in-out infinite; }
      .toy-swing { transform-box: fill-box; transform-origin: 50% 0%; animation: toy-swing 1.9s ease-in-out infinite; }
      .cat-stretch { transform-box: fill-box; transform-origin: 50% 100%; animation: cat-stretch 3.6s ease-in-out infinite; }
      .yarn-roll { transform-box: fill-box; transform-origin: 50% 50%; animation: yarn-roll 2.2s ease-in-out infinite; }
      .groom-head { transform-box: fill-box; transform-origin: 50% 85%; animation: groom-head 2.0s ease-in-out infinite; }
      .groom-paw { transform-box: fill-box; transform-origin: 50% 90%; animation: groom-paw 2.0s ease-in-out infinite; }
      .box-bob { transform-box: fill-box; transform-origin: 50% 100%; animation: box-bob 3.2s ease-in-out infinite; }
      @keyframes cat-tail {
        0%, 100% { transform: rotate(-9deg); }
        50% { transform: rotate(12deg); }
      }
      @keyframes cat-blink {
        0%, 92%, 100% { transform: scaleY(1); }
        96% { transform: scaleY(0.1); }
      }
      @keyframes cat-ear {
        0%, 84%, 100% { transform: rotate(0deg); }
        88% { transform: rotate(-10deg); }
        92% { transform: rotate(4deg); }
      }
      @keyframes catch-hop {
        0%, 100% { transform: translate(0px, 0px); }
        40% { transform: translate(8px, -7px); }
        60% { transform: translate(10px, -4px); }
      }
      @keyframes cat-head {
        0%, 100% { transform: rotate(2deg); }
        42% { transform: rotate(-5deg); }
        70% { transform: rotate(0deg); }
      }
      @keyframes cat-pupils {
        0%, 100% { transform: translate(1.2px, 0.7px); }
        42% { transform: translate(0.7px, -1.3px); }
        70% { transform: translate(1.1px, -0.3px); }
      }
      @keyframes catch-paw {
        0%, 100% { transform: rotate(8deg); }
        42% { transform: rotate(-34deg); }
        62% { transform: rotate(-18deg); }
      }
      @keyframes catch-fish {
        0%, 100% { transform: translate(0px, 4px); opacity: 0.78; }
        42% { transform: translate(-12px, -26px); opacity: 1; }
        70% { transform: translate(-2px, -8px); opacity: 0.95; }
      }
      @keyframes splash-pop {
        0%, 25% { transform: translateY(4px); opacity: 0; }
        45% { transform: translateY(-5px); opacity: 0.95; }
        85%, 100% { transform: translateY(-10px); opacity: 0; }
      }
      @keyframes cat-breathe {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(1.028); }
      }
      @keyframes cat-peek {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes stroll-path {
        0%, 100% { transform: translateX(-20px); }
        50% { transform: translateX(20px); }
      }
      @keyframes stroll-bob {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-2.5px); }
      }
      @keyframes leg-a {
        0%, 100% { transform: rotate(-12deg); }
        50% { transform: rotate(12deg); }
      }
      @keyframes leg-b {
        0%, 100% { transform: rotate(12deg); }
        50% { transform: rotate(-12deg); }
      }
      @keyframes loaf-breathe {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(1.03); }
      }
      @keyframes nap-tail {
        0%, 100% { transform: rotate(-3deg); }
        50% { transform: rotate(4deg); }
      }
      @keyframes zzz-float {
        0% { transform: translate(0px, 2px); opacity: 0; }
        25% { opacity: 0.9; }
        80% { opacity: 0.85; }
        100% { transform: translate(6px, -12px); opacity: 0; }
      }
      @keyframes play-hop {
        0%, 100% { transform: translateY(0px); }
        45% { transform: translateY(-3px); }
        70% { transform: translateY(0px); }
      }
      @keyframes cat-bat {
        0%, 100% { transform: rotate(0deg); }
        42% { transform: rotate(-22deg); }
        60% { transform: rotate(8deg); }
      }
      @keyframes toy-swing {
        0%, 100% { transform: rotate(-12deg); }
        50% { transform: rotate(14deg); }
      }
      @keyframes cat-stretch {
        0%, 100% { transform: scaleX(1) scaleY(1); }
        50% { transform: scaleX(1.06) scaleY(0.95); }
      }
      @keyframes yarn-roll {
        0%, 100% { transform: translateX(0px) rotate(0deg); }
        50% { transform: translateX(10px) rotate(28deg); }
      }
      @keyframes groom-head {
        0%, 100% { transform: rotate(0deg); }
        45% { transform: rotate(9deg) translateY(2px); }
      }
      @keyframes groom-paw {
        0%, 100% { transform: rotate(0deg); }
        45% { transform: rotate(-22deg) translateY(-3px); }
      }
      @keyframes box-bob {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(4px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .anim { animation: none !important; opacity: 0.92 !important; }
      }
    </style>
    <clipPath id="ai-cat-clip">
      <rect x="0" y="0" width="240" height="110" rx="12"/>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="239" height="109" rx="12" fill="url(#bg)" stroke="#45475a" stroke-width="1"/>
  <rect x="0" y="0" width="5" height="110" fill="url(#accent)" clip-path="url(#ai-cat-clip)"/>

  <!-- breed: nebula pose: groom -->
  <rect x="164" y="10" width="60" height="17" rx="8.5" fill="#89b4fa" fill-opacity="0.14" stroke="#89b4fa" stroke-opacity="0.55"/>
  <text x="194" y="21.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#89dceb">CATCHING</text>

  <g transform="translate(76, 68) scale(1, 1) scale(0.94)">
  <ellipse cx="0" cy="24" rx="21" ry="3.6" fill="#000000" fill-opacity="0.22"/>
  <g transform="translate(14, 18)">
    <g class="anim cat-tail">
      <path d="M0,0 C12,-2 19,-15 14,-27 C12,-31 7,-29 8,-24 C10,-16 6,-7 -2,-3 Z" fill="#28184a" stroke="#8b62ff" stroke-width="1"/>
    </g>
  </g>
  <g class="anim cat-breathe">
    <path d="M-17,22 C-19,7 -12,-6 0,-6 C12,-6 19,7 17,22 C17,24.5 13,25.5 0,25.5 C-13,25.5 -17,24.5 -17,22 Z" fill="#3b2566" stroke="#8b62ff" stroke-width="1.1"/>
    <ellipse cx="0" cy="10" rx="8" ry="10.5" fill="#503488" fill-opacity="0.92"/>
    <g transform="translate(0, 8) scale(0.9)"><circle cx="-8" cy="4" r="1.2" fill="#7ee0ff"/><circle cx="7" cy="10" r="1.3" fill="#f4b4cc"/><circle cx="-5" cy="15" r="0.9" fill="#7ee0ff"/></g>
    <ellipse cx="-8" cy="22.5" rx="5.4" ry="3.3" fill="#503488" stroke="#8b62ff" stroke-width="0.95"/>
  </g>
  <g class="anim groom-head">
    <path d="M-14,-21 L-17,-37 C-17,-39 -14,-40 -12,-38 L-2,-28 Z" fill="#3b2566" stroke="#8b62ff" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M-12.5,-23 L-14.5,-34 L-5.5,-27 Z" fill="#a87bff"/>
    <g transform="translate(11, -24)">
      <g class="anim cat-ear">
        <path d="M-8,-4 L2,-14 C4,-16 7,-15 7,-13 L4,4 Z" fill="#3b2566" stroke="#8b62ff" stroke-width="1.1" stroke-linejoin="round"/>
        <path d="M-5,-3 L4,-9 L2,2 Z" fill="#a87bff"/>
      </g>
    </g>
    <path d="M-17,-14 C-17,-24 -10,-30 0,-30 C10,-30 17,-24 17,-14 C18,-4 12,1 0,1 C-12,1 -18,-4 -17,-14 Z" fill="#3b2566" stroke="#8b62ff" stroke-width="1.15"/>
    <g transform="translate(0, -15) scale(0.9)"><path d="M-3,-9.5 A3.8,3.8 0 1,1 3,-9.5 A2.9,2.9 0 1,0 -3,-9.5 Z" fill="#7ee0ff" opacity="0.9"/><circle cx="-9" cy="-11" r="1.1" fill="#f4b4cc"/><circle cx="10" cy="-8" r="1.0" fill="#7ee0ff"/></g>
    <ellipse cx="-10" cy="-9" rx="3" ry="1.6" fill="#c07eff" fill-opacity="0.38"/>
    <ellipse cx="10" cy="-9" rx="3" ry="1.6" fill="#c07eff" fill-opacity="0.38"/>
    <path d="M-10,-15 Q-7,-12 -4,-15" fill="none" stroke="#110a24" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M4,-15 Q7,-12 10,-15" fill="none" stroke="#110a24" stroke-width="1.5" stroke-linecap="round"/>
    <polygon points="-1.6,-10.5 1.6,-10.5 0,-8.5" fill="#f4b4cc"/>
    <path d="M-3,-7.2 Q-1.5,-5.5 0,-7.5 Q1.5,-5.5 3,-7.2" fill="none" stroke="#7ee0ff" stroke-width="1.3" stroke-linecap="round"/>
    <g stroke="#cbb8ff" stroke-width="0.85" stroke-linecap="round" fill="none">
      <path d="M-11,-10.5 L-19,-11"/><path d="M-11,-8.5 L-20,-7.5"/>
      <path d="M11,-10.5 L19,-11"/><path d="M11,-8.5 L20,-7.5"/>
    </g>
  </g>
  <g transform="translate(9, 6)">
    <g class="anim groom-paw">
      <ellipse cx="0" cy="-6" rx="4.2" ry="6.2" fill="#503488" stroke="#8b62ff" stroke-width="0.95"/>
    </g>
  </g>
  </g>

</svg>
