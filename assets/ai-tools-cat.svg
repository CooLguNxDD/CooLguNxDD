<svg xmlns="http://www.w3.org/2000/svg" width="240" height="110" viewBox="0 0 240 110" role="img" aria-labelledby="ai-cat-title ai-cat-desc">
  <!-- theme: catportfolio/green -->
  <title id="ai-cat-title">Fish Catcher</title>
  <desc id="ai-cat-desc">Orange cat pouncing to catch a leaping fish.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14111f"/>
      <stop offset="100%" stop-color="#1c1730"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6e3a1"/>
      <stop offset="100%" stop-color="#94e2d5"/>
    </linearGradient>
    <style>
      .anim { will-change: transform, opacity; }
      .cat-tail { transform-box: fill-box; transform-origin: 10% 90%; animation: cat-tail 2.4s ease-in-out infinite; }
      .cat-blink { transform-box: fill-box; transform-origin: 50% 50%; animation: cat-blink 4.8s ease-in-out infinite; }
      .cat-ear { transform-box: fill-box; transform-origin: 40% 95%; animation: cat-ear 5.5s ease-in-out infinite; }
      .catch-hop { transform-box: fill-box; transform-origin: 50% 100%; animation: catch-hop 2.2s ease-in-out infinite; }
      .cat-head { transform-box: fill-box; transform-origin: 50% 85%; animation: cat-head 2.2s ease-in-out infinite; }
      .cat-pupils { animation: cat-pupils 2.2s ease-in-out infinite; }
      .catch-paw { transform-box: fill-box; transform-origin: 15% 65%; animation: catch-paw 2.2s ease-in-out infinite; }
      .catch-fish { animation: catch-fish 2.2s ease-in-out infinite; }
      .splash-pop { animation: splash-pop 2.2s ease-out infinite; }
      @keyframes cat-tail {
        0%, 100% { transform: rotate(-9deg); }
        50% { transform: rotate(12deg); }
      }
      @keyframes cat-blink {
        0%, 92%, 100% { transform: scaleY(1); }
        96% { transform: scaleY(0.1); }
      }
      @keyframes cat-ear {
        0%, 84%, 100% { transform: rotate(0deg); }
        88% { transform: rotate(-10deg); }
        92% { transform: rotate(4deg); }
      }
      @keyframes catch-hop {
        0%, 100% { transform: translate(0px, 0px); }
        40% { transform: translate(8px, -7px); }
        60% { transform: translate(10px, -4px); }
      }
      @keyframes cat-head {
        0%, 100% { transform: rotate(2deg); }
        42% { transform: rotate(-5deg); }
        70% { transform: rotate(0deg); }
      }
      @keyframes cat-pupils {
        0%, 100% { transform: translate(1.2px, 0.7px); }
        42% { transform: translate(0.7px, -1.3px); }
        70% { transform: translate(1.1px, -0.3px); }
      }
      @keyframes catch-paw {
        0%, 100% { transform: rotate(8deg); }
        42% { transform: rotate(-34deg); }
        62% { transform: rotate(-18deg); }
      }
      @keyframes catch-fish {
        0%, 100% { transform: translate(0px, 4px); opacity: 0.78; }
        42% { transform: translate(-12px, -26px); opacity: 1; }
        70% { transform: translate(-2px, -8px); opacity: 0.95; }
      }
      @keyframes splash-pop {
        0%, 25% { transform: translateY(4px); opacity: 0; }
        45% { transform: translateY(-5px); opacity: 0.95; }
        85%, 100% { transform: translateY(-10px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .anim { animation: none !important; opacity: 0.92 !important; }
      }
    </style>
    <clipPath id="ai-cat-clip">
      <rect x="0" y="0" width="240" height="110" rx="12"/>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="239" height="109" rx="12" fill="url(#bg)" stroke="#3a3358" stroke-width="1"/>
  <rect x="0" y="0" width="5" height="110" fill="url(#accent)" clip-path="url(#ai-cat-clip)"/>

  <!-- breed: tuxedo -->
  <rect x="164" y="10" width="60" height="17" rx="8.5" fill="#94e2d5" fill-opacity="0.14" stroke="#94e2d5" stroke-opacity="0.55"/>
  <text x="194" y="21.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#94e2d5">CATCHING</text>

  <g transform="translate(76, 68) scale(1, 1) scale(0.94)">
  <ellipse cx="-6" cy="22" rx="22" ry="3.5" fill="#000000" fill-opacity="0.24"/>
  <ellipse cx="68" cy="22" rx="24" ry="5" fill="#47bfff" fill-opacity="0.16" stroke="#7ee0ff" stroke-opacity="0.4" stroke-width="0.9"/>
  <g class="anim splash-pop">
    <circle cx="54" cy="13" r="2.0" fill="#7ee0ff"/><circle cx="78" cy="11" r="1.8" fill="#47bfff"/><circle cx="66" cy="8" r="1.5" fill="#d7c2ff"/>
  </g>
  <g transform="translate(66, 12)">
    <g class="anim catch-fish">
      <g transform="rotate(-22)">
        <polygon points="-7,0 -14,-4.5 -12,0 -14,4.5" fill="#7ee0ff"/>
        <ellipse cx="1" cy="0" rx="10" ry="5.2" fill="#47bfff" stroke="#7ee0ff" stroke-width="0.8"/>
        <circle cx="6" cy="-1.2" r="1.2" fill="#14111f"/>
        <circle cx="6.4" cy="-1.6" r="0.45" fill="#ffffff"/>
      </g>
    </g>
  </g>
  <g class="anim catch-hop">
    <g transform="translate(-22, 6)">
      <g class="anim cat-tail">
        <path d="M0,0 C-12,-4 -18,-18 -11,-27 C-7,-30 -3,-27 -5,-22 C-8,-15 -3,-6 2,-2 Z" fill="#14111f" stroke="#6852a8" stroke-width="1"/>
      </g>
    </g>
    <path d="M-22,18 C-23,4 -14,-2 -2,0 C8,2 14,10 12,20 L-19,20 Z" fill="#201c30" stroke="#6852a8" stroke-width="1.1"/>
    <g transform="translate(-6, 9) scale(0.85, 0.72)"><path d="M-9,-3 C-10,8 -6,20 0,21 C6,20 10,8 9,-3 Z" fill="#f5f2fc"/></g>
    <ellipse cx="-13" cy="20" rx="5.2" ry="3" fill="#f5f2fc" stroke="#6852a8" stroke-width="0.9"/>
    <ellipse cx="5" cy="20" rx="5.2" ry="3" fill="#f5f2fc" stroke="#6852a8" stroke-width="0.9"/>
    <g transform="translate(11, 2)">
      <g class="anim catch-paw">
        <ellipse cx="10" cy="-5" rx="7.2" ry="3.8" fill="#f5f2fc" stroke="#6852a8" stroke-width="1"/>
      </g>
    </g>
    <g class="anim cat-head">
      <path d="M-3,-17 L-5,-32 C-5,-34 -2,-34 0,-32 L6,-22 Z" fill="#201c30" stroke="#6852a8" stroke-width="1" stroke-linejoin="round"/>
      <path d="M-1.5,-19 L-2.5,-29 L4,-21 Z" fill="#6e56a8"/>
      <g transform="translate(15, -21)">
        <g class="anim cat-ear">
          <path d="M-5,-1 L3,-12 C5,-13 7,-12 7,-10 L4,4 Z" fill="#201c30" stroke="#6852a8" stroke-width="1" stroke-linejoin="round"/>
          <path d="M-3,-1 L4,-8 L2.5,2 Z" fill="#6e56a8"/>
        </g>
      </g>
      <ellipse cx="8" cy="-11" rx="14.5" ry="12.2" fill="#201c30" stroke="#6852a8" stroke-width="1.1"/>
      <g transform="translate(8, -11) scale(0.75)"><path d="M-10,6 C-6,1 0,-1 0,-1 C0,-1 6,1 10,6 C11,13 6,17 0,17 C-6,17 -11,13 -10,6 Z" fill="#f5f2fc"/></g>
      <ellipse cx="0.5" cy="-7" rx="2.6" ry="1.4" fill="#863bff" fill-opacity="0.38"/>
      <ellipse cx="16" cy="-7" rx="2.6" ry="1.4" fill="#863bff" fill-opacity="0.38"/>
      <g class="anim cat-blink">
        <ellipse cx="4" cy="-11.5" rx="3.2" ry="3.7" fill="#5ef2c8"/>
        <ellipse cx="14" cy="-11.5" rx="3.2" ry="3.7" fill="#5ef2c8"/>
        <g class="anim cat-pupils">
          <ellipse cx="4" cy="-11.5" rx="1.5" ry="2.6" fill="#0b0914"/>
          <circle cx="5" cy="-12.7" r="1.05" fill="#ffffff"/>
          <ellipse cx="14" cy="-11.5" rx="1.5" ry="2.6" fill="#0b0914"/>
          <circle cx="15" cy="-12.7" r="1.05" fill="#ffffff"/>
        </g>
      </g>
      <polygon points="7.5,-8 10.5,-8 9,-6.3" fill="#f4a8c4"/>
      <path d="M6,-5.1 Q7.5,-3.6 9,-5.2 Q10.5,-3.6 12,-5.1" fill="none" stroke="#6852a8" stroke-width="1.25" stroke-linecap="round"/>
      <g stroke="#e8e1f7" stroke-width="0.8" stroke-linecap="round" fill="none">
        <path d="M-1,-8 L-7,-9"/><path d="M-1,-6 L-7,-5.5"/>
        <path d="M17,-8 L23,-9"/><path d="M17,-6 L23,-5.5"/>
      </g>
    </g>
  </g>
  </g>

</svg>
