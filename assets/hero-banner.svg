<svg xmlns="http://www.w3.org/2000/svg" width="840" height="148" viewBox="0 0 840 148" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Andrew Liang — DevOps &amp; Agentic AI Systems Engineer</title>
  <desc id="hero-desc">Production MCP platforms, self-rendering GenUI, cloud infrastructure, and real-time graphics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14111f"/>
      <stop offset="100%" stop-color="#1c1730"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#863bff"/>
      <stop offset="100%" stop-color="#47bfff"/>
    </linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="636" y1="24" x2="810" y2="124">
      <stop offset="0%" stop-color="#863bff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#47bfff" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#863bff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#863bff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="banner-clip">
      <rect x="0" y="0" width="840" height="148" rx="12"/>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="839" height="147" rx="12" fill="url(#bg)" stroke="#3a3358" stroke-width="1"/>
  <rect x="0" y="0" width="5" height="148" fill="url(#accent)" clip-path="url(#banner-clip)"/>

  <!-- Ambient agentic DAG constellation -->
  <circle cx="728" cy="74" r="88" fill="url(#halo)" clip-path="url(#banner-clip)"/>
  <g stroke="url(#edge)" stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="646" y1="42" x2="704" y2="32"/>
    <line x1="646" y1="42" x2="684" y2="86"/>
    <line x1="684" y1="86" x2="704" y2="32"/>
    <line x1="704" y1="32" x2="764" y2="54"/>
    <line x1="684" y1="86" x2="742" y2="108"/>
    <line x1="684" y1="86" x2="764" y2="54"/>
    <line x1="764" y1="54" x2="742" y2="108"/>
    <line x1="764" y1="54" x2="804" y2="34"/>
    <line x1="742" y1="108" x2="802" y2="96"/>
    <line x1="764" y1="54" x2="802" y2="96"/>
  </g>
  <g>
    <circle cx="646" cy="42" r="8" fill="#863bff" fill-opacity="0.18" stroke="#863bff" stroke-opacity="0.45"/>
    <circle cx="646" cy="42" r="3" fill="#d7c2ff" fill-opacity="0.8"/>

    <circle cx="704" cy="32" r="9" fill="#47bfff" fill-opacity="0.16" stroke="#47bfff" stroke-opacity="0.48"/>
    <circle cx="704" cy="32" r="3.2" fill="#7ee0ff" fill-opacity="0.85"/>

    <circle cx="684" cy="86" r="10" fill="#863bff" fill-opacity="0.2" stroke="#863bff" stroke-opacity="0.5"/>
    <circle cx="684" cy="86" r="3.6" fill="#d7c2ff" fill-opacity="0.85"/>

    <circle cx="764" cy="54" r="11" fill="#47bfff" fill-opacity="0.18" stroke="#47bfff" stroke-opacity="0.55"/>
    <circle cx="764" cy="54" r="4" fill="#7ee0ff" fill-opacity="0.9"/>

    <circle cx="742" cy="108" r="8.5" fill="#863bff" fill-opacity="0.18" stroke="#863bff" stroke-opacity="0.45"/>
    <circle cx="742" cy="108" r="3" fill="#d7c2ff" fill-opacity="0.8"/>

    <circle cx="804" cy="34" r="6.5" fill="#47bfff" fill-opacity="0.15" stroke="#47bfff" stroke-opacity="0.4"/>
