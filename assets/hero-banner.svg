  <rect x="232" y="30" width="104" height="22" rx="11" fill="#2a2440" stroke="#4a4270"/>
  <text x="284" y="44.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#d7c2ff">@CooLguNxDD</text>

  <text x="32" y="80" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#47bfff">DevOps &amp; Agentic AI Systems Engineer</text>
  <text x="32" y="106" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#b5abc8">Production MCP platforms · Self-rendering GenUI · Cloud infrastructure · Real-time graphics</text>

  <rect x="32" y="118" width="102" height="20" rx="6" fill="#2a2440" stroke="#4a4270"/>
  <text x="83" y="131.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#e8d7ff">Vancouver, BC</text>

  <rect x="142" y="118" width="168" height="20" rx="6" fill="#2a2440" stroke="#4a4270"/>
  <text x="226" y="131.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#7ee0ff">Open Source · MCP · WebGL</text>
